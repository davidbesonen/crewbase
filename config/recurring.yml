development: &calendar_sync
  sync_ical_feeds:
    class: SyncIcalFeedsJob
    schedule: every 6 hours
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  prune_read_notifications:
    class: PruneReadNotificationsJob
    queue: maintenance
    schedule: every day at 3:15am

production:
  <<: *calendar_sync
  daily_matching_job_alerts:
    class: ScheduleWorkerNotificationsJob
    args: [job_alert]
    schedule: every day at 9am
  weekly_role_recommendations:
    class: ScheduleWorkerNotificationsJob
    args: [recommended_role]
    schedule: every Monday at 10am
  upcoming_booking_reminders:
    class: ScheduleWorkerNotificationsJob
    args: [upcoming_job_reminder]
    schedule: every hour
